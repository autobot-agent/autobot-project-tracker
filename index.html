<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autobot Project Tracker — Final Upgrade AI</title>
  <style>
    :root {
      --bg: #0e0e12;
      --surface: #16161c;
      --surface2: #1e1e26;
      --border: #2a2a38;
      --accent: #7c6dfa;
      --accent2: #b09bff;
      --text: #e8e8f0;
      --muted: #888899;
      --green: #3ecf8e;
      --yellow: #f5a623;
      --red: #ff6b6b;
      --blue: #4ea8de;
      --purple: #b09bff;
      --orange: #f5a623;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #12121a 0%, #1a1428 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
    }
    .header-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .updated-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
    }
    .updated-badge span { color: var(--accent2); font-weight: 600; }

    /* ── Layout ── */
    .container { max-width: 1280px; margin: 0 auto; padding: 28px 32px; }

    /* ── Priorities Section ── */
    .priorities-section { margin-bottom: 36px; }
    .priorities-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 6px;
    }
    .priorities-title {
      font-size: 16px; font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }
    .priorities-pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 0 rgba(78,168,222,0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(78,168,222,.4); }
      70%  { box-shadow: 0 0 0 6px rgba(78,168,222,0); }
      100% { box-shadow: 0 0 0 0 rgba(78,168,222,0); }
    }
    .priorities-subtitle {
      font-size: 12px; color: var(--muted); margin-bottom: 16px;
      display: flex; gap: 16px;
    }
    .priorities-subtitle span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .dot.blue { background: var(--blue); }
    .dot.purple { background: var(--purple); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .kanban-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .kanban-scroll::-webkit-scrollbar { height: 4px; }
    .kanban-scroll::-webkit-scrollbar-track { background: transparent; }
    .kanban-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .kanban-card {
      flex: 0 0 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .2s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .kanban-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .kanban-card.in-progress::before { background: var(--blue); }
    .kanban-card.on-hold::before { background: var(--yellow); }
    .kanban-card.not-started::before { background: var(--muted); }
    .kanban-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .kanban-del-id {
      font-size: 10px; font-family: monospace; color: var(--muted);
      margin-bottom: 5px;
    }
    .kanban-name {
      font-size: 13px; font-weight: 700; line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .kanban-project {
      font-size: 11px; color: var(--accent2); margin-bottom: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .kanban-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px;
    }
    .kanban-due { font-size: 10px; color: var(--muted); }
    .kanban-due.overdue { color: var(--red); font-weight: 600; }

    .empty-priorities {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Section ── */
    .section { margin-bottom: 36px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
    .section-title { font-size: 16px; font-weight: 700; }
    .section-count {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Filters ── */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    select {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 6px 10px;
      font-size: 12px; cursor: pointer; outline: none;
    }
    select:focus { border-color: var(--accent); }
    .filter-reset {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .filter-reset:hover { border-color: var(--accent); color: var(--accent2); }

    /* ── Projects Grid ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }
    .project-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      transition: border-color .2s; cursor: pointer;
    }
    .project-card:hover { border-color: var(--accent); }
    .project-card-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 10px;
    }
    .project-id { font-size: 10px; color: var(--muted); font-family: monospace; }
    .project-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .project-desc {
      font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .project-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    /* ── Deliverable count bar ── */
    .del-count-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .del-count-total {
      font-size: 11px; font-weight: 700; color: var(--text);
      white-space: nowrap;
    }
    .del-count-breakdown {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .del-count-item {
      display: flex; align-items: center; gap: 3px;
      font-size: 10px; color: var(--muted);
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      min-width: 40px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width .3s;
    }

    /* ── Tags & Badges ── */
    .tag {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 8px; font-size: 11px; color: var(--muted);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600;
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
    .badge.in-progress { background: rgba(78,168,222,.15); color: var(--blue); border: 1px solid rgba(78,168,222,.3); }
    .badge.in-progress::before { background: var(--blue); }
    .badge.not-started { background: rgba(136,136,153,.1); color: var(--muted); border: 1px solid var(--border); }
    .badge.not-started::before { background: var(--muted); }
    .badge.on-hold { background: rgba(245,166,35,.15); color: var(--yellow); border: 1px solid rgba(245,166,35,.3); }
    .badge.on-hold::before { background: var(--yellow); }
    .badge.completed { background: rgba(62,207,142,.15); color: var(--green); border: 1px solid rgba(62,207,142,.3); }
    .badge.completed::before { background: var(--green); }
    .badge.cancelled { background: rgba(255,107,107,.15); color: var(--red); border: 1px solid rgba(255,107,107,.3); }
    .badge.cancelled::before { background: var(--red); }

    .priority { border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
    .priority.critical { background: rgba(255,107,107,.15); color: var(--red); border: 1px solid rgba(255,107,107,.3); }
    .priority.high { background: rgba(245,166,35,.15); color: var(--orange); border: 1px solid rgba(245,166,35,.3); }
    .priority.medium { background: rgba(176,155,255,.15); color: var(--purple); border: 1px solid rgba(176,155,255,.3); }
    .priority.low { background: rgba(62,207,142,.1); color: var(--green); border: 1px solid rgba(62,207,142,.2); }

    /* ── Deliverables Table ── */
    .del-table { width: 100%; border-collapse: collapse; }
    .del-table thead th {
      background: var(--surface2); padding: 10px 14px; text-align: left;
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
    }
    .del-table tbody tr {
      border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s;
    }
    .del-table tbody tr:hover { background: var(--surface2); }
    .del-table tbody td { padding: 12px 14px; vertical-align: top; font-size: 13px; }
    .del-id { font-size: 10px; color: var(--muted); font-family: monospace; }
    .del-name { font-weight: 600; margin-bottom: 2px; }
    .del-project { font-size: 11px; color: var(--accent2); }

    /* ── Table wrapper ── */
    .table-wrapper {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.7); z-index: 200;
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; max-width: 680px; width: 100%;
      max-height: 85vh; overflow-y: auto; padding: 28px; position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted);
      width: 28px; height: 28px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; font-size: 16px;
    }
    .modal-close:hover { color: var(--text); border-color: var(--accent); }
    .modal-id { font-size: 11px; color: var(--muted); font-family: monospace; margin-bottom: 6px; }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
    .modal-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .modal-section { margin-bottom: 18px; }
    .modal-section-label {
      font-size: 11px; color: var(--muted); text-transform: uppercase;
      letter-spacing: .6px; margin-bottom: 6px; font-weight: 600;
    }
    .modal-section-content { font-size: 13px; line-height: 1.65; color: var(--text); white-space: pre-wrap; }
    .modal-meta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; margin-bottom: 18px;
    }
    .modal-meta-key { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .modal-meta-val { font-size: 13px; font-weight: 500; }
    .modal-divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .blocker-box {
      background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.25);
      border-radius: 8px; padding: 12px 14px; font-size: 12px;
      color: #ff9a9a; line-height: 1.5;
    }
    .progress-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; font-size: 13px;
      line-height: 1.65; white-space: pre-wrap;
    }

    /* ── Misc ── */
    .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
    .section-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    .hidden { display: none !important; }
  </style>
</head>

<header>
  <div class="header-left">
    <div class="logo">FU</div>
    <div>

      <div class="header-sub">Final Upgrade AI · Lin (autobot)</div>

  </div>
  <div class="updated-badge">Last synced <span id="sync-date">—</span></div>
</header>

<div class="container">

    <div class="priorities-subtitle" id="global-stats"></div>
    <div id="kanban-container"></div>
  </div>

  <hr class="section-divider" />

  <!-- Projects -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Projects</div>
      <div class="section-count" id="proj-count"></div>
    </div>
    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Status</span>
        <select id="proj-status-filter" onchange="filterProjects()"><option value="">All</option></select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Quarter</span>
        <select id="proj-quarter-filter" onchange="filterProjects()"><option value="">All</option></select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Priority</span>
        <select id="proj-priority-filter" onchange="filterProjects()"><option value="">All</option></select>
      </div>
      <button class="filter-reset" onclick="resetProjectFilters()">Reset</button>
    </div>
    <div class="projects-grid" id="projects-grid"></div>
  </div>

  <hr class="section-divider" />

  <!-- Deliverables -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Deliverables</div>
      <div class="section-count" id="del-count"></div>
    </div>
    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Status</span>
        <select id="del-status-filter" onchange="filterDeliverables()"><option value="">All</option></select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Project</span>
        <select id="del-project-filter" onchange="filterDeliverables()"><option value="">All</option></select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Priority</span>
        <select id="del-priority-filter" onchange="filterDeliverables()"><option value="">All</option></select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Impact</span>
        <select id="del-impact-filter" onchange="filterDeliverables()"><option value="">All</option></select>
      </div>
      <button class="filter-reset" onclick="resetDelFilters()">Reset</button>
    </div>
    <div class="table-wrapper">
      <table class="del-table">
        <thead>
          <tr>
            <th>Deliverable</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Due Date</th>
            <th>Owner</th>
            <th>Impact Area</th>
          </tr>
        </thead>
        <tbody id="del-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

// ── HELPERS ──────────────────────────────────────────────────────────────────
function statusClass(s) { return s ? s.toLowerCase().replace(/\s+/g,'-') : 'not-started'; }
function badge(s) { return `<span class="badge ${statusClass(s)}">${s||'—'}</span>`; }
function prio(p) { return p ? `<span class="priority ${p.toLowerCase()}">${p}</span>` : '—'; }

function parseDate(str) {
  if (!str) return null;
  const d = new Date(str);
  return isNaN(d) ? null : d.getTime();
}

function isRecent(lastUpdated, windowMs = 48 * 60 * 60 * 1000) {
  const ts = parseDate(lastUpdated);
  if (!ts) return false;
  return Math.abs(SYNC_TS - ts) <= windowMs;
}

function isOverdue(dueStr) {
  if (!dueStr || dueStr === 'TBD' || dueStr === 'Recurring' || dueStr === 'N/A') return false;
  const ts = parseDate(dueStr);
  return ts && ts < SYNC_TS;
}

// ── PRIORITIES KANBAN ────────────────────────────────────────────────────────
function renderPriorities() {
  // Filter: In Progress + last updated within 48h
  const priorities = DATA.deliverables.filter(d =>
    d.Status === 'In Progress' && isRecent(d['Last Updated'])
  );

  // Global stats subtitle
  const counts = {
    'In Progress': 0, 'Not Started': 0, 'On Hold': 0, 'Completed': 0
  };
  DATA.deliverables.forEach(d => { if (counts[d.Status] !== undefined) counts[d.Status]++; });
  document.getElementById('global-stats').innerHTML = `
    <span><span class="dot blue"></span>${counts['In Progress']} in progress</span>
    <span><span class="dot purple"></span>${counts['Not Started']} not started</span>
    <span><span class="dot yellow"></span>${counts['On Hold']} on hold</span>
    <span><span class="dot green"></span>${counts['Completed']} completed</span>
  `;

  const container = document.getElementById('kanban-container');
  if (!priorities.length) {
    container.innerHTML = '<div class="empty-priorities">No deliverables updated in the last 48h — you\'re all caught up!</div>';
    return;
  }

  container.innerHTML = `
    <div class="kanban-scroll">
      ${priorities.map(d => {
        const overdue = isOverdue(d['Due Date']);
        return `
          <div class="kanban-card ${statusClass(d.Status)}" onclick="openDelModal(${JSON.stringify(d).replace(/"/g,'&quot;')})">
            <div class="kanban-del-id">${d['Deliverable ID']}</div>
            <div class="kanban-name">${d['Deliverable Name']}</div>
            <div class="kanban-project">${d['Project Name']}</div>
            <div class="kanban-footer">
              <span class="kanban-due ${overdue ? 'overdue' : ''}">📅 ${d['Due Date'] || 'TBD'}</span>
              ${prio(d.Priority)}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ── PROJECTS ─────────────────────────────────────────────────────────────────
function getDelsByProject(projectName) {
  return DATA.deliverables.filter(d => d['Project Name'] === projectName);
}

function renderProjects(list) {
  const grid = document.getElementById('projects-grid');
  document.getElementById('proj-count').textContent = list.length;
  if (!list.length) { grid.innerHTML = '<div class="empty-state">No projects match your filters.</div>'; return; }

  grid.innerHTML = list.map(p => {
    const dels = getDelsByProject(p['Project Name']);
    const statusCounts = {};
    dels.forEach(d => { statusCounts[d.Status] = (statusCounts[d.Status] || 0) + 1; });
    const total = dels.length;
    const done  = statusCounts['Completed'] || 0;
    const pct   = total ? Math.round((done / total) * 100) : 0;

    const breakdownParts = [];
    if (statusCounts['In Progress']) breakdownParts.push(`<span class="del-count-item"><span class="dot blue"></span>${statusCounts['In Progress']} in progress</span>`);
    if (statusCounts['On Hold'])     breakdownParts.push(`<span class="del-count-item"><span class="dot yellow"></span>${statusCounts['On Hold']} on hold</span>`);
    if (statusCounts['Not Started']) breakdownParts.push(`<span class="del-count-item"><span class="dot purple"></span>${statusCounts['Not Started']} not started</span>`);
    if (statusCounts['Completed'])   breakdownParts.push(`<span class="del-count-item"><span class="dot green"></span>${statusCounts['Completed']} done</span>`);

    return `
      <div class="project-card" onclick="openProjectModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
        <div class="project-card-top">
          <div>
            <div class="project-id">${p['Project ID']}</div>
            <div class="project-name">${p['Project Name']}</div>
          </div>
          ${badge(p.Status)}
        </div>
        <div class="project-desc">${p['Objective / Description'] || ''}</div>
        ${total > 0 ? `
          <div class="del-count-bar">
            <span class="del-count-total">${total} deliverable${total !== 1 ? 's' : ''}</span>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="del-count-breakdown">${breakdownParts.join('')}</div>
          </div>
        ` : ''}
        <div class="project-meta">
          ${prio(p.Priority)}
          <span class="tag">📅 ${p.Quarter || '—'}</span>
          <span class="tag">👤 ${p.Owner || '—'}</span>
          <span class="tag">🏷 ${p['Impact Area'] || '—'}</span>
        </div>
      </div>
    `;
  }).join('');
}

function filterProjects() {
  const s = document.getElementById('proj-status-filter').value;
  const q = document.getElementById('proj-quarter-filter').value;
  const p = document.getElementById('proj-priority-filter').value;
  renderProjects(DATA.projects.filter(x =>
    (!s || x.Status === s) && (!q || x.Quarter === q) && (!p || x.Priority === p)
  ));
}

function resetProjectFilters() {
  ['proj-status-filter','proj-quarter-filter','proj-priority-filter'].forEach(id => document.getElementById(id).value = '');
  renderProjects(DATA.projects);
}

function resetDelFilters() {
